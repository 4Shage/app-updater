[package]
name = "updater-gui"
version.workspace = true
edition.workspace = true
description = "Updater i menedzer aplikacji"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
updater-lib = { path = "../updater-lib" }
gui-common = { path = "../gui-common" }
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package]
name = "updater-server"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

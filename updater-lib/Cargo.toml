[package]
name = "updater-lib"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
anyhow = "1"
dirs = "5"
hex = "0.4"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = "9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
